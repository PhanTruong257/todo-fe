<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Subtle glow inner circle -->
  <circle cx="256" cy="256" r="180" fill="#ffffff" opacity="0.06"/>

  <!-- Book Icon -->
  <g filter="url(#shadow)" transform="translate(106, 126)">
    <!-- Left Page -->
    <path d="M150 200 C90 170 30 175 0 185 L0 30 C30 20 90 15 150 45 Z" fill="url(#bookGrad)" opacity="0.95"/>
    <!-- Right Page -->
    <path d="M150 200 C210 170 270 175 300 185 L300 30 C270 20 210 15 150 45 Z" fill="url(#bookGrad)"/>
    <!-- Center Spine Spine -->
    <path d="M150 45 L150 200" stroke="#6366f1" stroke-width="6" stroke-linecap="round"/>
    <!-- Ribbon Bookmark -->
    <path d="M150 45 L150 140 L165 125 L180 140 L180 45 Z" fill="#ec4899"/>
  </g>
</svg>
