name: Deploy Frontend to AWS S3 & CloudFront

on:
  push:
    tags:
      - 'v*' # Tự động kích hoạt khi tạo tag phiên bản, ví dụ: v1.0.0, v1.0.1, v2.0.0

jobs:
  deploy:
    name: Build & Deploy to S3
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Cài đặt Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Cài đặt Dependencies
        run: npm install --legacy-peer-deps

      - name: 🔨 Đóng gói ứng dụng (Build Vite)
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://13.228.71.202:4000' }}

      - name: 🔑 Cấu hình AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: 🚀 Đồng bộ file build lên AWS S3
        run: |
          aws s3 sync ./dist s3://${{ secrets.AWS_S3_BUCKET }} --delete

      - name: 🔄 Xóa Cache CloudFront (CDN Invalidation)
        if: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
